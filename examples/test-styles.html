<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>样式测试 - Cell Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .test-title {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Cell Pro 样式测试</h1>
    
    <div class="test-container">
        <h2 class="test-title">原生 HTML 按钮（对比用）</h2>
        <button type="button">默认按钮</button>
        <button type="button" style="background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px;">蓝色按钮</button>
        <button type="button" style="background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px;">灰色按钮</button>
    </div>

    <div class="test-container">
        <h2 class="test-title">Cell Pro 组件测试</h2>
        <div id="app">
            <h3>ShareButton 组件</h3>
            <share-button text="测试文本" button-text="复制测试"></share-button>
            
            <h3>HelpLink 组件</h3>
            <help-link text="帮助文档" href="https://example.com"></help-link>
        </div>
    </div>

    <div class="test-container">
        <h2 class="test-title">样式隔离验证</h2>
        <p>下面的按钮应该使用 cell-pro 前缀的样式：</p>
        <div class="cell-pro">
            <button class="ant-btn ant-btn-primary">Primary 按钮</button>
            <button class="ant-btn ant-btn-ghost">Ghost 按钮</button>
            <button class="ant-btn ant-btn-dashed">Dashed 按钮</button>
            <button class="ant-btn ant-btn-link">Link 按钮</button>
            <button class="ant-btn ant-btn-text">Text 按钮</button>
            <button class="ant-btn ant-btn-default">Default 按钮</button>
        </div>
        
        <p>下面的按钮应该使用原生样式（不受 cell-pro 影响）：</p>
        <div>
            <button class="ant-btn ant-btn-primary">Primary 按钮（原生）</button>
            <button class="ant-btn ant-btn-ghost">Ghost 按钮（原生）</button>
        </div>
    </div>

    <script type="module">
        import { createApp } from 'vue'
        import CellPro from '../dist/cell-pro.es.js'
        
        const app = createApp({
            template: `
                <div>
                    <h3>ShareButton 组件</h3>
                    <ShareButton text="测试文本" button-text="复制测试"></ShareButton>
                    
                    <h3>HelpLink 组件</h3>
                    <HelpLink text="帮助文档" href="https://example.com"></HelpLink>
                </div>
            `
        })
        
        // 注册 Cell Pro 组件
        app.use(CellPro)
        
        app.mount('#app')
    </script>
</body>
</html>
