<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Design Vue 主题样式测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
        }
        .test-section h3 {
            margin-top: 0;
            color: #1677ff;
        }
        .button-group {
            margin: 10px 0;
        }
        .button-group button {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .info-box {
            background: #e6f4ff;
            border: 1px solid #91caff;
            border-radius: 6px;
            padding: 16px;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Ant Design Vue 主题样式测试</h1>
        <p>这个页面测试 Ant Design Vue 的主题系统是否正常工作。</p>

        <div class="info-box">
            <h4>测试说明</h4>
            <p>下面的按钮应该使用 Ant Design Vue 的主题样式，包括：</p>
            <ul>
                <li>主题色：#1677ff</li>
                <li>圆角：6px</li>
                <li>字体大小：14px</li>
                <li>行高：1.5715</li>
            </ul>
        </div>

        <div class="test-section">
            <h3>按钮样式测试</h3>
            <div class="button-group">
                <button class="cell-pro-btn cell-pro-btn-primary">主要按钮</button>
                <button class="cell-pro-btn cell-pro-btn-default">默认按钮</button>
                <button class="cell-pro-btn cell-pro-btn-dashed">虚线按钮</button>
                <button class="cell-pro-btn cell-pro-btn-text">文本按钮</button>
                <button class="cell-pro-btn cell-pro-btn-link">链接按钮</button>
            </div>
            
            <div class="button-group">
                <button class="cell-pro-btn cell-pro-btn-primary cell-pro-btn-lg">大按钮</button>
                <button class="cell-pro-btn cell-pro-btn-primary">默认尺寸</button>
                <button class="cell-pro-btn cell-pro-btn-primary cell-pro-btn-sm">小按钮</button>
            </div>
            
            <div class="button-group">
                <button class="cell-pro-btn cell-pro-btn-primary" disabled>禁用按钮</button>
                <button class="cell-pro-btn cell-pro-btn-primary cell-pro-btn-loading">加载中</button>
            </div>
        </div>

        <div class="test-section">
            <h3>主题色测试</h3>
            <p>主题色应该是 #1677ff（蓝色）：</p>
            <div style="display: flex; gap: 20px; align-items: center;">
                <div style="width: 50px; height: 50px; background-color: #1677ff; border-radius: 6px;"></div>
                <span>主题色块</span>
            </div>
        </div>

        <div class="test-section">
            <h3>样式隔离测试</h3>
            <p>下面的按钮应该使用 cell-pro 前缀的样式：</p>
            <button class="cell-pro-btn cell-pro-btn-primary">cell-pro 样式按钮</button>
            
            <p>下面的按钮应该使用默认样式：</p>
            <button class="ant-btn ant-btn-primary">默认样式按钮</button>
        </div>

        <div class="test-section">
            <h3>Web Components 测试</h3>
            <p>使用 Web Components 的按钮：</p>
            <share-button button-text="复制链接" variant="primary"></share-button>
            <help-link text="帮助文档" icon-type="question"></help-link>
        </div>
    </div>

    <script type="module">
        // 导入构建后的组件库
        import { registerWebComponents } from '../dist/cell-pro.es.js';
        
        // 注册 Web Components
        registerWebComponents();
        
        console.log('组件库加载完成！');
        
        // 测试主题配置是否正确加载
        console.log('主题配置已加载');
    </script>
</body>
</html>
